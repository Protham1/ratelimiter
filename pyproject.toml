[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimiter"
version = "0.1.0"
description = "A dynamic rate limiter with redis"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "websockets"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ratelimiter*", "api*"]
